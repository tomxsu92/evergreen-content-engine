<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Evergreen Content Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 10px 0;
    }
    a {
      text-decoration: none;
      color: #0066cc;
    }
    a:hover {
      text-decoration: underline;
    }
    .note {
      text-align: center;
      color: #666;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <h1>Evergreen Articles</h1>
  <p class="note">This site is updated automatically.</p>

  <ul id="article-list">
    <li>Loading articles…</li>
  </ul>

  <script>
  fetch("articles.json")
    .then(response => response.json())
    .then(articles => {
      const list = document.getElementById("article-list");
      list.innerHTML = "";

      articles.forEach(article => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = article.url;
        a.textContent = article.title;
        li.appendChild(a);
        list.appendChild(li);
      });

      if (articles.length === 0) {
        list.innerHTML = "<li>No articles yet.</li>";
      }
    })
    .catch(() => {
      document.getElementById("article-list").innerHTML =
        "<li>Articles index not found.</li>";
    });
</script>


</body>
</html>
